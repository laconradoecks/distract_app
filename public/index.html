  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

ospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #A893D9;\">For creators<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 4.5vw, 60px); line-height: 1; letter-spacing: -0.03em;\">Turn your AI videos into income.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #E4DAF9;\">Post your short AI video, attach the prompt, and choose: free, or a small price. Every Monday the Weekly Story Challenge drops a theme, and the best entries get pinned to the top of the feed.<\u002Fp>\n<a href=\"#join\" style=\"align-self: flex-start; background: {{accent}}; color: #1A0B33; text-decoration: none; font-weight: 700; font-size: 17px; padding: 0 28px; min-height: 56px; border-radius: 14px; display: inline-flex; align-items: center;\">Claim your username<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex: 1 1 360px; background: #2A1450; border: 1px solid #3A2268; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 18px;\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A893D9; text-transform: uppercase; letter-spacing: 0.08em;\">This week's story challenge<\u002Fspan>\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.15;\">\"A pet who thinks they're the boss of the house.\"<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid #4E2F88; color: #E4DAF9;\">#BossPet<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid #4E2F88; color: #E4DAF9;\">10 to 30 seconds<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px soli Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"features\" style=\"background: #F6F1FF; color: #1A0B33;\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 112px 24px; display: flex; flex-direction: column; gap: 48px;\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px;\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #4B3A6E;\">Why DistractApp<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 4.5vw, 60px); line-height: 1; letter-spacing: -0.03em;\">Your break from the real world.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;\">\n<div style=\"background: #FFFFFF; border: 1px solid #E7DCFB; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 12px;\">\n<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1A0B33\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 7h16\"><\u002Fpath><path d=\"M4 12h10\"><\u002Fpath><path d=\"M4 17h7\"><\u002Fpath><path d=\"m17 15 3 3-3 3\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 700;\">The prompt behind every video<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4B3A6E;\">Love a video? Get its prompt in one tap. Story prompts hold the whole short, scene by scene, so even beginners get a finished video in one go.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #E7DCFB; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 12px;\">\n<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1A0B33\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" n it's time to work.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"creators\" style=\"max-width: 1240px; margin: 0 auto; padding: 112px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px;\">\n<div style=\"flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 20px;\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #A893D9;\">For creators<\u002Fspan>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 4.5vw, 60px); line-height: 1; letter-spacing: -0.03em;\">Turn your AI videos into income.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #E4DAF9;\">Post your short AI video, attach the prompt, and choose: free, or a small price. Every Monday the Weekly Story Challenge drops a theme, and the best entries get pinned to the top of the feed.<\u002Fp>\n<a href=\"#join\" style=\"align-self: flex-start; background: #FF4FA3; color: #1A0B33; text-decoration: none; font-weight: 700; font-size: 17px; padding: 0 28px; min-height: 56px; border-radius: 14px; display: inline-flex; align-items: center;\">Claim your username<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex: 1 1 360px; background: #2A1450; border: 1px solid #3A2268; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 18px;\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A893D9; text-transform: uppercase; letter-spacing: 0.08em;\">This week's story challenge<\u002Fspan>\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.15;\">\"A pet who thinks they're the boss of the house.\"<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid #4E2F88; color: #E4DAF9;\">#BossPet<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid #4E2F88; color: #E4DAF9;\">10 to 30 seconds<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid #4E2F88; color: #E4DAF9;\">ends Sunday<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"padding: 0 24px 96px;\">\n<div style=\"max-width: 1240px; margin: 0 auto; background: #FF4FA3; color: #1A0B33; border-radius: 32px; padding: 72px 40px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 24px;\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(40px, 6vw, 80px); line-height: 0.95; letter-spacing: -0.035em;\">Real life can wait.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; max-width: 540px; line-height: 1.55;\">Be first in when DistractApp opens. Viewers get the feed before anyone else. Creators claim their username and get featured in launch week.<\u002Fp>\n<form style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; max-width: 560px;\">\n<label for=\"email2\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);\">Email address<\u002Flabel>\n<input id=\"email2\" type=\"email\" placeholder=\"you@email.com\" style=\"flex: 1 1 260px; min-height: 56px; padding: 0 20px; font-size: 17px; font-family: 'DM Sans', sans-serif; background: #FFFFFF; color: #1A0B33; border: 2px solid #1A0B33; border-radius: 14px;\">\n<input type=\"text\" name=\"website\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\" style=\"position:absolute;left:-9999px;width:1px;height:1px;opacity:0\"><button type=\"submit\" style=\"min-height: 56px; padding: 0 28px; font-size: 17px; font-weight: 700; font-family: 'DM Sans', sans-serif; background: #1A0B33; color: #FFFFFF; border: none; border-radius: 14px; cursor: pointer;\">Join the waitlist<\u002Fbutton>\n<\u002Fform><p style=\"margin: 10px 0 0; font-size: 13px; line-height: 1.4; opacity: 0.8;\">By joining, you agree to our <a href=\"/privacy/\" style=\"color: inherit; text-decoration: underline;\">Privacy Policy<\u002Fa>. Unsubscribe anytime.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<footer style=\"border-top: 1px solid #3A2268;\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 32px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 14px; color: #A893D9;\">\n<span>© 2026 DistractApp · Take a break from reality. Made with AI, on purpose.<\u002Fspan>\n<span style=\"display: flex; gap: 20px;\"><a href=\"/privacy/\" style=\"color: #D6C8F2;\">Privacy<\u002Fa><a href=\"mailto:privacy@distractapp.com\" style=\"color: #D6C8F2;\">Contact<\u002Fa><\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FF4FA3&quot;,&quot;options&quot;:[&quot;#FF4FA3&quot;,&quot;#9B5CFF&quot;,&quot;#FFFFFF&quot;,&quot;#E879F9&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:4300}}\">\nclass Component extends DCLogic {\nrenderVals() {\nconst open = !!(this.state && this.state.menuOpen);\nreturn {\naccent: this.props.accent ?? '#FF4FA3',\nmenuOpen: open,\nmenuClosed: !open,\nmenuExpanded: open ? 'true' : 'false',\ntoggleMenu: () => this.setState({ menuOpen: !open }),\ncloseMenu: () => this.setState({ menuOpen: false })\n};\n}\n}\n<\u002Fscript>\n\n\n<script>\n// Waitlist: send both signup forms to /api/waitlist and show the result under the form.\n(function () {\n  var MESSAGES = {\n    ok: \"You're on the list! We'll email you when DistractApp opens.\",\n    invalid_email: \"That email doesn't look right. Check it and try again.\",\n    rate: \"Too many tries. Wait a minute and try again.\",\n    error: \"We couldn't save your email. Please try again in a moment.\"\n  };\n  function status(form) {\n    var el = form.nextElementSibling;\n    if (!el || !el.hasAttribute('data-waitlist-status')) {\n      el = document.createElement('p');\n      el.setAttribute('data-waitlist-status', '');\n      el.setAttribute('role', 'status');\n      el.style.cssText = 'margin:10px 0 0;font-size:15px;line-height:1.4;font-weight:700;color:inherit';\n      form.insertAdjacentElement('afterend', el);\n    }\n    return el;\n  }\n  document.addEventListener('submit', function (e) {\n    var form = e.target;\n    var input = form.querySelector('input[type=\"email\"]');\n    if (!input) return;\n    e.preventDefault();\n    var button = form.querySelector('button[type=\"submit\"]');\n    var trap = form.querySelector('input[name=\"website\"]');\n    var msg = status(form);\n    var email = input.value.trim();\n    if (!input.checkValidity() || !email) {\n      msg.textContent = '⚠ ' + MESSAGES.invalid_email; input.focus(); return;\n    }\n    var label = button.textContent;\n    button.disabled = true; button.textContent = 'Joining…'; msg.textContent = '';\n    fetch('/api/waitlist', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ email: email, source: form.id === 'join' ? 'hero' : 'footer', website: trap ? trap.value : '' })\n    }).then(function (r) {\n      return r.json().catch(function () { return {}; }).then(function (d) {\n        if (r.ok && d.ok) return 'ok';\n        if (r.status === 429) return 'rate';\n        return d.error === 'invalid_email' ? 'invalid_email' : 'error';\n      });\n    }, function () { return 'error'; }).then(function (result) {\n      msg.textContent = (result === 'ok' ? '✓ ' : '⚠ ') + MESSAGES[result];\n      if (result === 'ok') { input.value = ''; button.textContent = \"You're in ✓\"; }\n      else { button.disabled = false; button.textContent = label; }\n    });\n  }, true);\n})();\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>"

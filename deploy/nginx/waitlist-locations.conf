# Included inside the distractapp HTTPS server block.
# Install: cp to /etc/nginx/snippets/distractapp-waitlist.conf, then add
#          `include snippets/distractapp-waitlist.conf;` to the 443 server block.

location = /api/waitlist {
    limit_except POST { deny all; }
    limit_req zone=distract_waitlist burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
}

location /admin/ {
    auth_basic "DistractApp waitlist";
    auth_basic_user_file /etc/nginx/distractapp-admin.htpasswd;
    add_header X-Robots-Tag "noindex" always;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
}

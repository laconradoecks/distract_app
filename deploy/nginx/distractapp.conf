# Nginx server block for the DistractApp landing page.
# Lives alongside the droplet's existing site(s); nginx picks the block by server_name.
#
# Install (on the droplet):
#   sudo cp /var/www/distractapp/deploy/nginx/distractapp.conf /etc/nginx/sites-available/distractapp
#   sudo sed -i 's/DOMAIN_HERE/yourdomain.com/g' /etc/nginx/sites-available/distractapp
#   sudo ln -s /etc/nginx/sites-available/distractapp /etc/nginx/sites-enabled/distractapp
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com   # adds HTTPS + redirect

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_HERE www.DOMAIN_HERE;

    root /var/www/distractapp/public;
    index index.html;

    # Only serve what's in public/ — the rest of the repo stays private.
    location / {
        try_files $uri $uri/ =404;
    }

    # The page is one self-contained file; let browsers revalidate it so updates show up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
